name: Deploy the review server to Hugging Face
on:
  push:
    branches: [main]
    paths: ['space/**', '.github/workflows/deploy-space.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "huggingface_hub>=0.26"
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          AUDIO_REPO: ${{ vars.AUDIO_REPO }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token, space = os.environ['HF_TOKEN'], os.environ['HF_SPACE']
          api = HfApi(token=token)
          api.create_repo(space, repo_type='space', space_sdk='docker', exist_ok=True)
          # the sheikh's recording lives in a private dataset the Space reads with this token
          audio = os.environ.get('AUDIO_REPO') or space.split('/')[0] + '/taiba-audio'
          api.create_repo(audio, repo_type='dataset', private=True, exist_ok=True)
          api.add_space_secret(space, 'HF_TOKEN', token)
          api.add_space_variable(space, 'AUDIO_REPO', audio)
          api.upload_folder(folder_path='space', repo_id=space, repo_type='space',
                            ignore_patterns=['sim_*.py', 'static/index.src.html', '__pycache__/*'],
                            commit_message='update from GitHub')
          print('deployed to https://huggingface.co/spaces/' + space)
          PY
